name: Go

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  live:
    name: Live platform
    # A pull request from a fork gets no ID token, so the live test would only fail to start.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The job's ID token is the subject token. The SDK fetches it from the runner's token
      # endpoint for each exchange, so no token is written to disk, and STS verifies it against
      # the provider in the pool before IAM lets the job act as the service account.
      - name: Configure the external account
        run: |
          mkdir -p "$RUNNER_TEMP/cbws"
          cat > "$RUNNER_TEMP/cbws/external-account.json" <<EOF
          {
            "type": "external_account",
            "audience": "projects/cbws-e2e-sdk/workloadIdentityPools/github/providers/actions",
            "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
            "service_account_impersonation": "projects/cbws-e2e-sdk/serviceAccounts/sdk-e2e@cbws-e2e-sdk.iam-sa.cbws.xyz",
            "credential_source": {
              "url": "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://sts.cbws.cloud",
              "headers": {
                "Authorization": "Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
              },
              "format": {
                "type": "json",
                "subject_token_field_name": "value"
              }
            }
          }
          EOF
          echo "CBWS_CREDENTIALS=$RUNNER_TEMP/cbws/external-account.json" >> "$GITHUB_ENV"
      - run: go test -v -run TestLive ./...
        env:
          CBWS_SDK_LIVE_PROJECT: cbws-e2e-sdk
